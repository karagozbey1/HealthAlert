    - walking
    - sitting
    - standing
    - lying
  source_limitation: UCI-HAR-only
  standalone_alert_allowed: false
  critical_trigger_allowed: false
  notes:
    - Accepted UCI-HAR-only artifact alias copied from exp_a_uci_only_baseline.
    - PAMAP2 mixed model disabled
    - standing confidence moderate

gait_instability_model:
  enabled: true
  status: accepted_auxiliary_low_weight
  mode: accepted_auxiliary_low_weight
