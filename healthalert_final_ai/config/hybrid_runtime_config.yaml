activity_expert:
  enabled: true
  status: accepted_single_source_baseline
  model_path: outputs/hybrid_redesign/activity_expert_v2_uci_only/best_model.pt
  norm_stats_path: outputs/hybrid_redesign/activity_expert_v2_uci_only/imu_norm_stats.json
