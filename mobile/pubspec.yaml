name: mobile
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  fl_chart: ^0.65.0
  percent_indicator: ^4.2.3
  intl: ^0.18.0
  glassmorphism: ^3.0.0
  http: ^1.2.1
  shared_preferences: ^2.2.2
  # BLE transport (primary device connection)
  flutter_reactive_ble: ^5.3.1
  # Network connectivity detection
  connectivity_plus: ^6.0.3
  # Firebase core
  firebase_core: ^3.6.0
  # Cloud Firestore
  cloud_firestore: ^5.4.0
  # Permission handling (needed for BLE on Android)
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
