# ============================================================
# HealthAlert - Training Configuration
# ============================================================
# Engineering Decision Log:
#   - Multi-task loss weights: fall_weight=1.0 (primary task),
#     others lower to prevent gradient domination.
#   - Focal loss for fall detection: handles class imbalance
#   - AdamW with cosine annealing: stable convergence
#   - Gradient clipping at 1.0: prevents exploding gradients
#     common in CRNN architectures
# ============================================================

training:
  epochs: 100
  batch_size: 64
  num_workers: 4
  pin_memory: true
  gradient_clip: 1.0
  early_stopping_patience: 15
  save_best_metric: "val_f1_fall"

optimizer:
  name: "adamw"
  lr: 0.001
  weight_decay: 0.01
  betas: [0.9, 0.999]

scheduler:
  name: "cosine_annealing"
  T_max: 100
  eta_min: 0.00001

loss:
  fall_detection:
    type: "focal"
    alpha: 0.75
    gamma: 2.0
    weight: 1.0
  instability:
    type: "bce"
    weight: 0.5
    pos_weight: 5.0
  ppg_quality:
    type: "bce"
    weight: 0.3
    pos_weight: 3.0
  risk_score:
    type: "mse"
    weight: 0.4

model:
  imu_encoder:
    type: "crnn"
    cnn_channels: [32, 64, 128]
    cnn_kernel: 5
    rnn_hidden: 128
    rnn_layers: 2
    rnn_type: "gru"
    dropout: 0.3

  ppg_encoder:
    type: "cnn1d"
    channels: [16, 32, 64]
    kernel_size: 7
    dropout: 0.2

  vitals_mlp:
    input_dim: 2
    hidden_dims: [32, 16]
    dropout: 0.2

  fusion:
    type: "attention"
    embed_dim: 128
    num_heads: 4
    dropout: 0.2

  quality_gate:
    hidden_dim: 64
    threshold: 0.5

augmentation:
  enabled: true
  imu_noise_std: 0.02
  imu_scale_range: [0.9, 1.1]
  time_warp_ratio: 0.1
  mixup_alpha: 0.2
